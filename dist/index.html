    <canvas id="starfield"></canvas>

    <div class="container">
        <header>
            <div class="logo">TAIWAN <span class="highlight">AQI</span> TECH</div>

        <main>
            <section class="hero">
                <h1>台灣空氣汙染監測與分析</h1>
                <p class="subtitle">高中期末專題研究：探討地理因素與產業活動對空氣品質之影響</p>
            </section>

            <section class="content-box">
                <h2>專案主題介紹</h2>
                <p>
                    本研究旨在探討台灣不同季節下，PM2.5 與 O3 等汙染物的擴散趨勢。透過數據視覺化，分析東北季風對境外汙染物的傳輸，以及中南部地區因地形（中央山脈）阻擋導致的汙染累積現象。
                </p>
                <div class="features">
                    <div class="feature-item">數據分析：Python Pandas</div>
                    <div class="feature-item">地理資訊：GIS 地圖疊加</div>
                    <div class="feature-item">預測模型：LSTM 時間序列</div>
                </div>
            </section>
